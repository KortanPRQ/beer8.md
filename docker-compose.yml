version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: beer8_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: beer8_db
      MYSQL_USER: beer8_user
      MYSQL_PASSWORD: beer8_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - beer8_network

volumes:
  mysql_data:
    driver: local

networks:
  beer8_network:
    driver: bridge
